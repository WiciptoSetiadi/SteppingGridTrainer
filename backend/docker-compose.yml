version: '3.8'

services:
  ai-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stepping_grid_ai_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - SUPABASE_URL=${SUPABASE_URL:-http://host.docker.internal:54321}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-placeholder-key}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:-}
      - MIN_SESSIONS_FOR_PREDICTION=5
      - TARGET_ACCURACY=90.0
      - HOST=0.0.0.0
      - PORT=8000
    extra_hosts:
      - "host.docker.internal:host-gateway"
