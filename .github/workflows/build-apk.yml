name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK (Release)
        run: flutter build apk --release

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SteppingGridTrainer-app-release
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0-build-${{ github.run_number }}
          name: Stepping Grid Trainer v1.0.0 (Release APK)
          body: |
            ## 📱 Stepping Grid Trainer - Android APK Release
            
            Aplikasi terapi jalan interaktif pasca-stroke terhubung ke Supabase Cloud dan hardware IoT matras ESP32.
            
            ### 📥 Download & Install:
            1. Download file `app-release.apk` di bawah.
            2. Buka file APK di ponsel Android Anda (Redmi Note 11).
            3. Izinkan penginstalan dari sumber tidak dikenal jika diminta (*Allow from this source*).
            4. Buka aplikasi **Stepping Grid Trainer**.
          files: build/app/outputs/flutter-apk/app-release.apk
